name: Sync Cantus from Notion

on:
  schedule:
    # Cada ~15 días: día 1 y 16 de cada mes a las 06:00 UTC
    - cron: "0 6 1,16 * *"
  workflow_dispatch: # permite lanzarlo a mano desde Actions

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: pip install -r scripts/requirements.txt

      - name: Sync from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_CHARACTERS_DB: ${{ secrets.NOTION_CHARACTERS_DB }}
          NOTION_FACTIONS_DB: ${{ secrets.NOTION_FACTIONS_DB }}
          NOTION_PREHISTORIA_ID: ${{ secrets.NOTION_PREHISTORIA_ID }}
          NOTION_POWER_ID: ${{ secrets.NOTION_POWER_ID }}
        run: python scripts/sync_cantus.py

      - name: Commit & push if changed
        run: |
          git config user.name "cantus-sync-bot"
          git config user.email "cantus-sync@users.noreply.github.com"
          git add Cantus-Alarum-Nigrarum
          if git diff --staged --quiet; then
            echo "Sin cambios"
          else
            git commit -m "chore(cantus): sync automático desde Notion $(date -u +%Y-%m-%d)"
            git push
          fi
